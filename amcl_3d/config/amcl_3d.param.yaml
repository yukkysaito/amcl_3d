/**:
  ros__parameters:
    # frames
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link

    # map: load a PCD file at startup, or leave empty to subscribe to the "map" topic
    map_pcd_file: ""

    use_imu: false  # take the angular velocity from the "imu" topic instead of the odometry

    # tf / output
    transform_tolerance: 0.1  # [s] future dating of map->odom
    tf_timeout: 0.1           # [s]
    # time guards [s]: inputs stamped further ahead of the node clock are dropped (e.g. a sensor
    # on another clock), and a scan older than the newest one by more than time_jump_threshold
    # (> max_measurement_delay) restarts the filter at its estimate (e.g. a looping rosbag)
    max_stamp_lead: 1.0
    time_jump_threshold: 5.0
    publish_tf: true
    publish_particles: true
    # used when the initial pose has no covariance: x, y, z [m], roll, pitch, yaw [rad]
    default_initial_pose_stddev: [0.5, 0.5, 0.1, 0.02, 0.02, 0.2]

    # particle filter
    initial_particle_num: 500
    # scan points per update (0: all). On the GPU 800 cost no more than 200 and are 20 % more
    # accurate (KITTI); on a CPU-only machine 200 take a third of the time
    scan_sample_num: 800
    # A scan counts as at most this many independent points: its points are strongly correlated,
    # and treating them as independent makes the filter overconfident. With tempered SMC the
    # likelihood enters in stages and can be sharper: 100 gives a consistent covariance (NEES ~3);
    # a single update (scan_tempered_smc.enabled: false) needs 5-10. 0 disables the limit.
    scan_max_effective_points: 100
    # Adaptive tempered SMC with MCMC moves: the scan enters in as many stages as its sharpness
    # needs (conditional ESS kept at cess_ratio N), the moves keep the motion prior, so the
    # particle covariance matches the error. KITTI, 6 sequences x 3 seeds, against the annealed
    # particle filter it replaced: 0.081 -> 0.075 m, kidnapped 0.146 -> 0.104 m, at 5.3 instead
    # of 6 likelihood evaluations per scan (docs/evaluation.md). false: one importance update.
    scan_tempered_smc:
      enabled: true
      max_stages: 8  # the last one takes the rest of the likelihood
      mcmc_steps: 1  # per stage
      # random_walk: generic 6-DoF.
      # gauss_newton: Langevin moves along the scan's Gauss-Newton curvature (needs the
      #   likelihood_field); 0.072 m but slow recovery from a wrong pose (docs/evaluation.md).
      kernel: random_walk
      cess_ratio: 0.15  # conditional ESS / N kept by a stage; lower: fewer, larger stages
      # temper with a quarter of the scan points, then bridge to all of them: on a CPU-only
      # machine a third faster at the same accuracy with 800 points; no gain with CUDA
      coarse_to_fine: false
    # Inputs up to this much older than the newest scan (delayed sensors, late odometry) are fused
    # at their own time by replaying the newer scans (the result of time order) [s]; costs one
    # particle set per scan of memory and one update per newer scan.
    max_measurement_delay: 1.0
    random_seed: -1       # -1: random
    # CPU threads of the filter; 0 uses every hardware thread, which was slower than 4-16 threads on
    # a 32 thread CPU (idle OpenMP threads spin on the cores the rest of the update runs on)
    thread_num: 4

    motion_model:
      # twist: generic 6-DoF body twist with isotropic white velocity noise
      #   (std = scale * |velocity| + bias per sqrt(s), on each axis); robots, handheld sensors
      # vehicle: car-like; uses only the forward speed and the yaw rate (base frame at the rear
      #   axle center) with noise that grows with the speed; as accurate as twist on KITTI
      #   (docs/evaluation.md), tighter in yaw
      type: vehicle
      twist:
        linear_noise_scale: 0.1   # [1/sqrt(s)]
        linear_noise_bias: 0.1    # [m/s*sqrt(s)]
        angular_noise_scale: 0.1  # [1/sqrt(s)]
        angular_noise_bias: 0.02  # [rad/s*sqrt(s)]
      vehicle:
        speed_noise_scale: 0.1     # [1/sqrt(s)]
        speed_noise_bias: 0.1      # [m/s*sqrt(s)]
        yaw_rate_noise_scale: 0.1  # [1/sqrt(s)]
        yaw_rate_noise_bias: 0.02  # [rad/s*sqrt(s)]
        lateral_noise_scale: 0.1   # [1/sqrt(s)] lateral slip per |v|
        vertical_noise_scale: 0.1  # [1/sqrt(s)] vertical slip per |v| (suspension, calibration)
        attitude_noise_scale: 0.01 # [rad/sqrt(m)] roll / pitch random walk per sqrt(distance)
        min_noise_speed: 1.0        # [m/s] noise floor, keeps refining while stopped

    # applied to each scan in the base frame before sampling
    scan_filter:
      min_range: 1.0    # [m] from the base frame origin (removes the vehicle body)
      max_range: 100.0  # [m]
      min_z: -100.0     # [m]
      max_z: 100.0      # [m]
      voxel_size: 0.5   # [m] uniform density; 0 disables

    # how well a scan fits the map at each particle (see docs/evaluation.md)
    point_cloud_likelihood:
      # likelihood_field: distance from each point to the nearest map point; most accurate
      # ndt: Mahalanobis distance to the normal distribution of the map points in each voxel;
      #   ~10x less memory than the distance field, ~10 % more error on KITTI 07
      type: likelihood_field
      likelihood_field:
        max_distance: 1.0  # [m] point-to-map distance is clipped here (robust to dynamic objects)
        sigma: 0.2         # [m]
        map:
          # distance_field: precomputed nearest map points, ~12x faster updates than kdtree with
          #   the same accuracy on KITTI 07; memory ~0.3 MB per meter of route at 0.2 m
          # kdtree: exact nearest neighbor search, slow (~24 ms per update with the defaults)
          type: distance_field
          resolution: 0.2  # [m] distance_field voxel size
          # auto: cuda when amcl_3d_core was built with CUDA (by default when nvcc is found) and a
          #   GPU is present, else cpu; cuda: likelihood of the distance_field on the GPU (an
          #   error without it); cpu
          device: auto
      ndt:
        resolution: 1.0                # [m] voxel size
        min_point_num: 6               # voxels with fewer map points are dropped
        sigma: 0.2                     # [m] measurement noise added to every distribution
        max_mahalanobis_distance: 5.0  # per-point clipping [std dev]
        search_neighbors: true         # also match with the 6 face neighbors (wider basin)

    resampling:
      type: systematic          # systematic | kld
      ess_ratio_threshold: 0.5  # resample when ESS / N < threshold
      kld:
        min_particle_num: 100
        max_particle_num: 5000
        epsilon: 0.05
        delta: 0.01
        bin_size_xyz: 0.5  # [m]
        bin_size_yaw: 0.2  # [rad]

    # Published pose: 'best_cluster' is the mean of the cluster of particles with the most weight
    # (particles in touching grid cells form a cluster), 'mean' the mean of all particles, which
    # lies between the modes of a multimodal cloud (e.g. during global localization).
    estimate:
      type: best_cluster  # best_cluster | mean
      clustering:
        bin_size_xyz: 0.5  # [m]
        bin_size_yaw: 0.2  # [rad]

    # spread all particles when even the best particle explains the scan poorly (emcl)
    expansion_reset:
      enabled: false
      likelihood_threshold: 0.05  # per-point likelihood of the best particle, e.g. exp(-d^2 / (2 sigma^2))
      stddev: [0.3, 0.3, 0.05, 0.01, 0.01, 0.1]  # x, y, z [m], roll, pitch, yaw [rad]

    # ~/global_localization service (std_srvs/Trigger); use resampling.type: kld with it
    global_localization:
      particle_num: 20000
      cell_size: 1.0    # [m] grid to find the ground height
      base_height: 0.0  # [m] base frame above the ground

    # refine the published pose by GICP scan matching (cm-level on KITTI); the particles are not
    # corrected by it
    scan_matching:
      enabled: false
      max_correction: 1.0  # [m] reject matches farther than this from the particle estimate
      gicp:
        max_correspondence_distance: 1.0  # [m]
        robust_kernel_width: 3.0          # Cauchy kernel on the Mahalanobis distance of a pair

    augmented_mcl:
      enabled: false
      alpha_slow: 0.001
      alpha_fast: 0.1
      injection_stddev: [1.0, 1.0, 0.1, 0.05, 0.05, 0.5]  # x, y, z [m], roll, pitch, yaw [rad]
