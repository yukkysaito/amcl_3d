# kitti_evaluation options for cm-level accuracy (see docs/evaluation.md):
#   kitti_evaluation <dataset_dir> 07 config=tools/config/kitti_accurate.yaml [key=value ...]
# the node defaults (tempered SMC, 800 scan points, the likelihood on the GPU) plus GICP
# refinement: KITTI 07 0.034 m over 3 seeds, the 6 sequences 0.045 m, 3.6 ms per update. Without
# a CUDA build use device=cpu (and coarse=1 to save a third of the likelihood time).
update: tsmc          # tempered SMC with random walk moves (the node default)
effective: 100
cess: 0.15
sample: 800           # scan points
device: cuda          # likelihood on the GPU
scan_matching: 1      # refine the estimate by GICP
max_correction: 0.1   # [m] keep the particle estimate when GICP moves it farther
